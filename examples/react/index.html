<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EKO Web: React demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23ef6a1e'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../shared/eko-player.css" />

    <!--
      Bare specifiers resolved to the same esm.sh URLs the page itself imports, so
      the library's own `import ... from "react"` (see ../../dist/react.js) lands on
      the exact same module instance as the React this page renders with. Two
      copies of React in one page is the classic cause of "hooks don't work"; the
      import map is what prevents that here.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom": "https://esm.sh/react-dom@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client"
        }
      }
    </script>

    <style>
      /*
        Everything below is for pieces this demo needs that eko-player.css (shared with the
        other demos) has no opinion on: the previous/next transport buttons, the file/tone
        loading row, and a couple of small states. eko-player.css itself is not edited, so
        this stays local to this one page. Copied verbatim from the vanilla demo's own local
        style block, so the three demos share pixel-identical chrome around the library.
      */
      .ew-skip {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: var(--out-xs), var(--bevel);
        border: none;
        color: var(--ink-2);
        display: grid;
        place-items: center;
        cursor: pointer;
        flex: 0 0 auto;
      }
      .ew-skip svg {
        width: 15px;
        height: 15px;
      }
      .ew-skip:disabled,
      .ew-play:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .ew-load {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        background: var(--bg);
        box-shadow: var(--in);
        border-radius: 13px;
        padding: 12px 18px;
        margin-bottom: 16px;
      }
      .ew-load button {
        font: 600 11px var(--font);
        color: var(--ink-2);
        background: var(--bg);
        box-shadow: var(--out-xs), var(--bevel);
        border: none;
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
        flex: 0 0 auto;
      }
      .ew-load .ew-err {
        color: var(--accent);
        font: 600 11px var(--font);
        flex: 1 1 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Classic script, runs even if the module below never starts. If nothing on the page
      // has booted after a moment, say so instead of leaving a blank card: a silent dead page
      // is the worst possible demo to hand someone.
      window.__ekoBooted = false;
      setTimeout(function () {
        if (window.__ekoBooted) return;
        var root = document.getElementById("root");
        if (!root) return;
        root.textContent =
          "The page script never started, so nothing here works. Almost always this page " +
          "was opened over file:// (ES module imports need a real origin) or the server " +
          "isn't rooted at the repo (dist/ has to resolve one level up from " +
          "examples/react/). Run npm run build, then npm run harness, then open " +
          "http://localhost:4321/examples/react/. Check the console for the exact error.";
        root.style.cssText = "max-width:680px;margin:40px auto;font-family:sans-serif;color:#b00";
      }, 1500);
    </script>

    <script type="module">
      import { createElement as h, Fragment, useEffect, useRef, useState } from "react";
      import { createRoot } from "react-dom/client";
      import { EkoWebEngine } from "../../dist/index.js";
      import { useEkoPlayer, useEkoTime } from "../../dist/react.js";
      import { readReplayGain } from "../../dist/replaygain.js";
      import { attachSpectrum } from "../shared/spectrum.js";
      import { coverFor } from "../shared/cover.js";

      const TRANSITIONS = ["gapless", "crossfade", "gap"];

      /** mm:ss, clamped to zero for anything not-yet-known (NaN, negative). */
      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
        const total = Math.floor(seconds);
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${m}:${s.toString().padStart(2, "0")}`;
      }

      /** What the "GAIN" readout says for one queue slot's loudness info. */
      function describeGainInfo(info) {
        if (!info) return "-";
        return info.source === "tag" ? `tag, ${info.gainDb.toFixed(2)} dB` : "measured, no tag";
      }

      /**
       * A 440 Hz sine of exactly 880 cycles, as a 16-bit WAV blob. The whole-cycle length is
       * the point: the waveform is continuous across the loop point, so a click at the seam
       * can only come from the transition policy, never from the audio itself. Copied from
       * examples/player/index.html, which already solved this.
       */
      function makeTestTone() {
        const rate = 48000;
        const cycles = 880;
        const freq = 440;
        const frames = Math.round((cycles / freq) * rate);
        const bytes = new ArrayBuffer(44 + frames * 2);
        const view = new DataView(bytes);
        const ascii = (offset, text) => {
          for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
        };
        ascii(0, "RIFF");
        view.setUint32(4, 36 + frames * 2, true);
        ascii(8, "WAVEfmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, rate, true);
        view.setUint32(28, rate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        ascii(36, "data");
        view.setUint32(40, frames * 2, true);
        for (let i = 0; i < frames; i++) {
          const sample = Math.sin((2 * Math.PI * freq * i) / rate) * 0.25;
          view.setInt16(44 + i * 2, Math.round(sample * 32767), true);
        }
        return new Blob([bytes], { type: "audio/wav" });
      }

      function titleFromFileName(name) {
        return (name || "Untitled").replace(/\.[^./]+$/, "");
      }

      function sourceLabel(kind) {
        if (kind === "buffer") return "Buffer decode";
        if (kind === "element") return "Streaming element";
        return "No track";
      }

      /**
       * The clock, and only the clock, subscribes to `useEkoTime`. `currentTime` changes
       * every animation frame while playing; if this lived in `PlayerCard` below, every
       * frame would re-render the whole card (title, spectrum markup, signal path, queue,
       * all of it) for a number only this strip actually shows. Splitting it into its own
       * component means only this component's own render function re-runs each frame,
       * which is exactly the discrete/continuous split the vanilla demo draws by hand
       * between its renderState() and renderTime() functions.
       *
       * `duration` comes in as a prop from the parent's `useEkoPlayer` snapshot rather
       * than from `useEkoTime`, because the engine only emits `timeupdate` from the
       * playback loop, a seek, or a natural end: right after a fresh track loads,
       * `useEkoTime`'s own duration can read stale until one of those fires. The
       * snapshot's duration updates on `durationchange`, which fires the moment metadata
       * is known, so it is the reliable source; `useEkoTime` here is only for `currentTime`.
       */
      function ProgressBar({ engine, duration }) {
        const { currentTime } = useEkoTime(engine);
        const trackRef = useRef(null);

        function seekAt(clientX) {
          const el = trackRef.current;
          if (!el || duration <= 0) return;
          const rect = el.getBoundingClientRect();
          const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
          engine.seek(ratio * duration);
        }

        function onPointerDown(event) {
          event.currentTarget.setPointerCapture?.(event.pointerId);
          seekAt(event.clientX);
        }

        function onPointerMove(event) {
          if (event.buttons !== 1) return;
          seekAt(event.clientX);
        }

        const pct = duration > 0 ? Math.min(100, (currentTime / duration) * 100) : 0;
        const remaining = Math.max(0, duration - currentTime);

        return h(
          "div",
          { className: "ew-scrub" },
          h("span", { className: "t" }, formatTime(currentTime)),
          h(
            "div",
            {
              className: "ew-track",
              ref: trackRef,
              onPointerDown,
              onPointerMove,
            },
            h("div", { className: "fill", style: { width: `${pct}%` } }),
            h("div", { className: "knob", style: { left: `${pct}%` } }),
          ),
          h("span", { className: "t r" }, formatTime(remaining)),
        );
      }

      /**
       * EKO's own segmented LED display (examples/shared/spectrum.js), shared with the
       * other demos so all three read as the same instrument. The effect runs once, for
       * this component's canvas, and hands attachSpectrum a getter rather than
       * `engine.analyser` itself: the engine builds its graph lazily, and a transition-mode
       * switch replaces the whole engine object, so a value captured at effect-setup time
       * would go stale the moment that happens. `engineRef` is kept current on every
       * render so the getter always reads the live engine no matter how long the effect
       * (and its one canvas) has been mounted.
       */
      function Spectrum({ engine }) {
        const canvasRef = useRef(null);
        const engineRef = useRef(engine);
        engineRef.current = engine;

        useEffect(() => {
          return attachSpectrum(canvasRef.current, () => engineRef.current.analyser);
        }, []);

        return h("div", { className: "ew-spec" }, h("canvas", { ref: canvasRef }));
      }

      /**
       * Everything but the clock. One `useEkoPlayer(engine)` call drives the whole card:
       * transport, queue position, volume, signal path and the GAIN readout. Its snapshot
       * only changes on discrete events (play, pause, a track boundary, a volume change),
       * so this component re-renders far less often than `ProgressBar` above.
       */
      function PlayerCard({
        engine,
        trackGainInfo,
        transitionMode,
        onTransitionChange,
        theme,
        onToggleTheme,
        onFileChange,
        onToneClick,
        errorMsg,
      }) {
        const player = useEkoPlayer(engine);
        const volTrackRef = useRef(null);
        const track = player.track;

        const queueText = track ? `${player.index + 1} / ${player.queueLength}` : "No queue";
        const gainText = track ? describeGainInfo(trackGainInfo[player.index]) : "No track";

        function volumeAt(clientX) {
          const el = volTrackRef.current;
          if (!el) return 0;
          const rect = el.getBoundingClientRect();
          return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        }

        function onVolumePointerDown(event) {
          event.currentTarget.setPointerCapture?.(event.pointerId);
          player.setVolume(volumeAt(event.clientX));
        }

        function onVolumePointerMove(event) {
          if (event.buttons !== 1) return;
          player.setVolume(volumeAt(event.clientX));
        }

        const volumePct = Math.round(player.volume * 100);

        return h(
          "div",
          { className: "eko-web" + (player.state === "playing" ? " playing" : "") },
          h(
            "div",
            { className: "ew-head" },
            h("div", {
              className: "ew-cover",
              // Generated from the title: the library parses no artwork, so drawing it is
              // what keeps this slot meaningful rather than an empty square.
              style: player.track
                ? {
                    backgroundImage: `url("${coverFor(player.track.title || player.track.id, { dark: theme === "dark" })}")`,
                  }
                : undefined,
            }),
            h(
              "div",
              { className: "ew-meta" },
              h(
                "div",
                { className: "ew-lab" },
                "NOW PLAYING",
                h(
                  "span",
                  { className: "ew-eqg", "aria-hidden": "true" },
                  h("i", null),
                  h("i", null),
                  h("i", null),
                  h("i", null),
                ),
              ),
              h(
                "div",
                { className: "ew-title" },
                track ? track.title || "Untitled" : "Nothing loaded",
              ),
              h(
                "div",
                { className: "ew-sub" },
                track ? track.artist || "" : "Choose a file, or use the test tone",
              ),
            ),
            h("span", { className: "ew-badge" }, "EKO WEB"),
            h(
              "button",
              {
                className: "ew-theme",
                "aria-label": theme === "dark" ? "Switch to light theme" : "Switch to dark theme",
                onClick: onToggleTheme,
              },
              h(
                "svg",
                {
                  viewBox: "0 0 24 24",
                  fill: "none",
                  stroke: "currentColor",
                  strokeWidth: "2",
                  strokeLinecap: "round",
                },
                h("path", { d: "M12 3a6.4 6.4 0 0 0 9 9 9 9 0 1 1-9-9z" }),
              ),
            ),
          ),

          h(
            "div",
            { className: "ew-load" },
            h("input", {
              type: "file",
              accept: "audio/*",
              multiple: true,
              "aria-label": "Choose audio files",
              onChange: onFileChange,
            }),
            h("button", { type: "button", onClick: onToneClick }, "Use a test tone"),
            errorMsg ? h("span", { className: "ew-err" }, errorMsg) : null,
          ),

          h(Spectrum, { engine }),

          h(
            "div",
            { className: "ew-sig" },
            h(
              "div",
              { className: "node" },
              h("span", { className: "k" }, "SOURCE"),
              h("span", { className: "v" }, sourceLabel(player.sourceKind)),
            ),
            h("span", { className: "link" }),
            h(
              "div",
              { className: "node" },
              h("span", { className: "k" }, "ENGINE"),
              h("span", { className: "v" }, "Web Audio, 32-bit float"),
            ),
            h("span", { className: "link" }),
            h(
              "div",
              { className: "node o" },
              h("span", { className: "k" }, "OUTPUT"),
              h("span", { className: "v" }, "System mixer"),
            ),
            h(
              "div",
              {
                className: "seal",
                title:
                  "The rate the browser is mixing at. Audio is decoded and resampled to this rate, so what you hear is not the file's own rate.",
              },
              h(
                "span",
                { className: "ring" },
                h(
                  "svg",
                  {
                    viewBox: "0 0 24 24",
                    fill: "none",
                    stroke: "currentColor",
                    strokeWidth: "2",
                    strokeLinecap: "round",
                    strokeLinejoin: "round",
                  },
                  h("path", { d: "M3 12h3l2-5 4 10 2-5h7" }),
                ),
              ),
              h(
                "span",
                { className: "sl" },
                `${Math.round(engine.context.sampleRate / 100) / 10} kHz`,
              ),
            ),
          ),

          // eko-player.css only styles a signal-path strip with SOURCE/ENGINE/OUTPUT, the
          // shape above; it says nothing about queue position or ReplayGain. Rather than
          // invent new classes for those, this reuses the same strip's node/k/v/link
          // building blocks a second time, so it inherits the same spacing, wrapping and
          // dark-mode behaviour with zero new CSS. Same choice the vanilla demo makes.
          h(
            "div",
            { className: "ew-sig" },
            h(
              "div",
              { className: "node" },
              h("span", { className: "k" }, "QUEUE"),
              h("span", { className: "v" }, queueText),
            ),
            h("span", { className: "link" }),
            h(
              "div",
              { className: "node o" },
              h("span", { className: "k" }, "GAIN"),
              h("span", { className: "v" }, gainText),
            ),
          ),

          h(
            "div",
            { className: "ew-ctrls" },
            h(
              "button",
              {
                className: "ew-skip",
                disabled: !track,
                "aria-label": "Previous track",
                onClick: () => player.previous(),
              },
              h(
                "svg",
                { viewBox: "0 0 24 24", fill: "currentColor" },
                h("path", { d: "M6 6h2v12H6zM20 6 9 12l11 6z" }),
              ),
            ),
            h(
              "button",
              {
                className: "ew-play",
                disabled: !track,
                "aria-label": player.paused ? "Play" : "Pause",
                onClick: () => (player.paused ? player.play() : player.pause()),
              },
              player.paused
                ? h(
                    "svg",
                    { viewBox: "0 0 24 24", fill: "currentColor" },
                    h("path", { d: "M8 5v14l11-7z" }),
                  )
                : h(
                    "svg",
                    { viewBox: "0 0 24 24", fill: "currentColor" },
                    h("path", { d: "M7 5h4v14H7zM13 5h4v14h-4z" }),
                  ),
            ),
            h(
              "button",
              {
                className: "ew-skip",
                disabled: !track,
                "aria-label": "Next track",
                onClick: () => player.next(),
              },
              h(
                "svg",
                { viewBox: "0 0 24 24", fill: "currentColor" },
                h("path", { d: "M16 6h2v12h-2zM4 6l11 6-11 6z" }),
              ),
            ),
            h(ProgressBar, { engine, duration: player.duration }),
            h("span", { className: "ew-live hidden" }, "LIVE"),
          ),

          h(
            "div",
            { className: "ew-ctrls2" },
            h(
              "div",
              { className: "ew-vol" },
              h("span", { className: "vk" }, "VOL"),
              h(
                "div",
                {
                  className: "ew-track",
                  ref: volTrackRef,
                  onPointerDown: onVolumePointerDown,
                  onPointerMove: onVolumePointerMove,
                },
                h("div", { className: "fill", style: { width: `${volumePct}%` } }),
                h("div", { className: "knob", style: { left: `${volumePct}%` } }),
              ),
            ),
            h(
              "div",
              { className: "ew-presets" },
              TRANSITIONS.map((mode) =>
                h(
                  "b",
                  {
                    key: mode,
                    className: transitionMode === mode ? "on" : "",
                    onClick: () => onTransitionChange(mode),
                  },
                  mode.charAt(0).toUpperCase() + mode.slice(1),
                ),
              ),
            ),
          ),

          h(
            "div",
            { className: "ew-foot" },
            h(
              "div",
              { className: "ew-note" },
              "A real gapless and crossfade scheduler, loudness matching from ReplayGain tags, and a live spectrum, all in the browser. Whatever you feed it is decoded and ",
              h("b", null, "resampled to your system rate"),
              ", so this is not bit-perfect and does not pretend to be.",
            ),
            h(
              "a",
              { className: "ew-dl", href: "https://github.com/reactivepixels/eko-web" },
              "EKO Web on GitHub",
            ),
          ),
        );
      }

      function App() {
        const [theme, setTheme] = useState(() =>
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light",
        );
        const [transitionMode, setTransitionMode] = useState("gapless");
        const [engine, setEngine] = useState(
          () => new EkoWebEngine({ normalize: true, transition: "gapless", crossfadeSeconds: 3 }),
        );
        const [trackGainInfo, setTrackGainInfo] = useState([]);
        const [errorMsg, setErrorMsg] = useState("");

        const entriesRef = useRef([]);
        const objectUrlsRef = useRef([]);
        const loadTokenRef = useRef(0);
        const skipRebuildRef = useRef(true);

        // data-theme has to sit on <html>: eko-player.css keys the whole dark palette,
        // including <body>'s own background, off `[data-theme="dark"] body`, which only
        // matches when an ANCESTOR of <body> carries the attribute.
        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
        }, [theme]);

        // The engine owns its `analyser` and audio graph, so this is the one place it is
        // torn down: on unmount, and again just before a rebuilt engine replaces it below
        // (this effect's own cleanup runs first, on the previous engine, the instant
        // `engine` changes to a new instance).
        useEffect(() => {
          const off = engine.on("error", ({ error }) => {
            setErrorMsg(`${error.code}: ${error.message}`);
          });
          return () => {
            off();
            engine.destroy();
          };
        }, [engine]);

        // `transition` is a construction-time option on EkoWebEngine, not something a
        // running engine can be told to change, so switching it builds a fresh one with
        // the new policy and re-queues whatever was already loaded, at the same queue
        // position. The old engine is destroyed by the effect above, whose cleanup fires
        // the moment `engine` state changes. Skipped on the first render: the engine
        // created above already has the initial mode.
        useEffect(() => {
          if (skipRebuildRef.current) {
            skipRebuildRef.current = false;
            return;
          }
          const resumeIndex = engine.getSnapshot().index;
          const next = new EkoWebEngine({
            normalize: true,
            transition: transitionMode,
            crossfadeSeconds: 3,
          });
          if (entriesRef.current.length > 0) {
            next.setQueue(
              entriesRef.current.map((e) => e.track),
              resumeIndex,
            );
          }
          setEngine(next);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [transitionMode]);

        async function readTrackGain(id, objectUrl, title, artist) {
          const tags = await readReplayGain(objectUrl);
          if (typeof tags.gainDb === "number") {
            return {
              track: { id, src: objectUrl, gainDb: tags.gainDb, title, artist },
              info: { source: "tag", gainDb: tags.gainDb },
            };
          }
          return { track: { id, src: objectUrl, title, artist }, info: { source: "measured" } };
        }

        /**
         * Load one or more picked files (or the generated test tone) into the queue.
         * `rawEntries` is `{ blob, name, artist }`, not a raw FileList: the tone has a name
         * and artist of its own, so both sources funnel through the same path rather than
         * one of them being a special case further down.
         *
         * Mirrors the vanilla demo's loadFiles: object URLs are created once per file and
         * revoked when superseded, and a token guards against two picks racing (a second
         * pick while the first's tag reads are still in flight).
         */
        async function loadFiles(rawEntries) {
          const token = ++loadTokenRef.current;
          const previousUrls = objectUrlsRef.current;

          if (rawEntries.length === 0) {
            previousUrls.forEach((url) => URL.revokeObjectURL(url));
            objectUrlsRef.current = [];
            entriesRef.current = [];
            setTrackGainInfo([]);
            engine.setQueue([]);
            return;
          }

          let trackId = 0;
          const entries = [];
          const newUrls = [];

          if (rawEntries.length === 1) {
            // A single file: queue it twice, so there is a real track boundary to hear the
            // transition mode land on.
            const objectUrl = URL.createObjectURL(rawEntries[0].blob);
            newUrls.push(objectUrl);
            const first = await readTrackGain(
              `track-${trackId++}`,
              objectUrl,
              rawEntries[0].name,
              rawEntries[0].artist,
            );
            entries.push(first);
            entries.push({ track: { ...first.track, id: `track-${trackId++}` }, info: first.info });
          } else {
            for (const raw of rawEntries) {
              const objectUrl = URL.createObjectURL(raw.blob);
              newUrls.push(objectUrl);
              entries.push(
                await readTrackGain(`track-${trackId++}`, objectUrl, raw.name, raw.artist),
              );
            }
          }

          if (token !== loadTokenRef.current) {
            // Superseded by a later pick while our tag reads were in flight: drop our own
            // results, clean up only the URLs we ourselves created.
            newUrls.forEach((url) => URL.revokeObjectURL(url));
            return;
          }

          previousUrls.forEach((url) => URL.revokeObjectURL(url));
          objectUrlsRef.current = newUrls;
          entriesRef.current = entries;
          setTrackGainInfo(entries.map((e) => e.info));
          setErrorMsg("");
          engine.setQueue(entries.map((e) => e.track));
        }

        function onFileChange(event) {
          const files = Array.from(event.target.files || []);
          event.target.value = "";
          if (files.length === 0) return;
          loadFiles(
            files.map((f) => ({ blob: f, name: titleFromFileName(f.name), artist: "Local file" })),
          );
        }

        function onToneClick() {
          loadFiles([
            { blob: makeTestTone(), name: "Test tone", artist: "440 Hz sine, generated" },
          ]);
        }

        return h(
          Fragment,
          null,
          h(
            "h1",
            {
              style: {
                position: "absolute",
                left: "-9999px",
                top: "auto",
                width: "1px",
                height: "1px",
                overflow: "hidden",
              },
            },
            "EKO Web: an embeddable lossless player in the browser",
          ),
          h(PlayerCard, {
            engine,
            trackGainInfo,
            transitionMode,
            onTransitionChange: setTransitionMode,
            theme,
            onToggleTheme: () => setTheme((t) => (t === "dark" ? "light" : "dark")),
            onFileChange,
            onToneClick,
            errorMsg,
          }),
          h(
            "p",
            { className: "caption" },
            h("b", null, "EKO Web, React demo"),
            ": the eko-web engine driven through its React binding (",
            h("code", null, "useEkoPlayer"),
            " and ",
            h("code", null, "useEkoTime"),
            "). Pick a short file, or press ",
            h("b", null, "Use a test tone"),
            ". Switch ",
            h("b", null, "Gapless"),
            ", ",
            h("b", null, "Crossfade"),
            " and ",
            h("b", null, "Gap"),
            " to hear the seam change; with a single file the queue holds it twice so there is a real boundary to hear. The ",
            h("b", null, "GAIN"),
            " readout says whether the loudness match came from a ReplayGain tag in the file or from the engine measuring the decoded audio itself.",
          ),
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
      window.__ekoBooted = true;
    </script>
  </body>
</html>
