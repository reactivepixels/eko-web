<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EKO Classic</title>
    <meta
      name="description"
      content="A click-wheel music player running on the EKO Web engine: spin the wheel to browse, scrub and set the volume."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/playground.css" />
    <link rel="stylesheet" href="./ipod.css" />
  </head>
  <body>
    <main class="room">
      <div class="stage" id="stage">
        <div class="scene" id="scene">
          <svg class="cable" viewBox="0 0 600 660" aria-hidden="true">
            <defs>
              <linearGradient id="ip-plug" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#bfc1c4" />
                <stop offset=".35" stop-color="#ffffff" />
                <stop offset=".7" stop-color="#e9eaec" />
                <stop offset="1" stop-color="#9fa2a6" />
              </linearGradient>
              <filter id="ip-cshadow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" />
              </filter>
            </defs>
            <path
              class="wire-shadow"
              d="M215,52 C215,26 170,20 148,58 C124,100 134,300 128,420 C124,500 112,540 80,556 C40,574 -30,568 -80,596"
              transform="translate(5 6)"
            />
            <path
              class="wire"
              d="M215,52 C215,26 170,20 148,58 C124,100 134,300 128,420 C124,500 112,540 80,556 C40,574 -30,568 -80,596"
            />
            <path
              class="wire-hi"
              d="M215,52 C215,26 170,20 148,58 C124,100 134,300 128,420 C124,500 112,540 80,556 C40,574 -30,568 -80,596"
              transform="translate(-.6 -.5)"
            />
            <path d="M212,51 L218,51 L217.2,64 L212.8,64 Z" fill="url(#ip-plug)" />
            <rect x="210" y="64" width="10" height="17" rx="2.2" fill="url(#ip-plug)" />
            <rect x="210" y="64" width="10" height="1.8" rx=".9" fill="#fff" />
          </svg>

          <div class="refl" aria-hidden="true"></div>
          <div class="floor-shadow" aria-hidden="true"></div>

          <button class="hold" id="hold" aria-pressed="false" aria-label="Hold switch"></button>

          <div class="pod">
            <div class="face">
              <div class="win">
                <div class="lcd" id="lcd">
                  <div class="ui" id="ui">
                    <div class="tb">
                      <span class="state" id="tbState"></span>
                      <div class="t" id="tbTitle">EKO</div>
                      <span class="lock" id="tbLock" hidden></span>
                      <span class="batt"><i></i></span>
                    </div>
                    <div class="panes" id="panes"></div>
                    <div class="toast" id="toast" hidden></div>
                  </div>
                </div>
                <div class="glass"></div>
              </div>

              <div class="wheel" id="wheel">
                <svg viewBox="0 0 186 186" aria-hidden="true">
                  <defs>
                    <radialGradient id="ip-wheel" cx=".42" cy=".3" r=".8">
                      <stop offset="0" stop-color="#eef0f2" />
                      <stop offset=".6" stop-color="#e1e4e7" />
                      <stop offset="1" stop-color="#d0d4d8" />
                    </radialGradient>
                    <linearGradient id="ip-rimlight" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#000" stop-opacity=".28" />
                      <stop offset=".5" stop-color="#000" stop-opacity=".05" />
                      <stop offset="1" stop-color="#fff" stop-opacity=".9" />
                    </linearGradient>
                    <radialGradient id="ip-btn" cx=".45" cy=".32" r=".75">
                      <stop offset="0" stop-color="#eef0f2" />
                      <stop offset=".7" stop-color="#d6d9dd" />
                      <stop offset="1" stop-color="#c3c7cc" />
                    </radialGradient>
                    <radialGradient id="ip-btn-down" cx=".5" cy=".55" r=".75">
                      <stop offset="0" stop-color="#dfe2e6" />
                      <stop offset=".7" stop-color="#cdd1d6" />
                      <stop offset="1" stop-color="#bcc1c6" />
                    </radialGradient>
                    <linearGradient id="ip-btnrim" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#fff" stop-opacity=".95" />
                      <stop offset="1" stop-color="#000" stop-opacity=".22" />
                    </linearGradient>
                    <radialGradient id="ip-touch" cx=".5" cy=".5" r=".5">
                      <stop offset="0" stop-color="#ffffff" stop-opacity=".95" />
                      <stop offset=".32" stop-color="#ffffff" stop-opacity=".7" />
                      <stop offset=".55" stop-color="#ef6a1e" stop-opacity=".22" />
                      <stop offset="1" stop-color="#ef6a1e" stop-opacity="0" />
                    </radialGradient>
                  </defs>
                  <circle cx="93" cy="93" r="93" fill="url(#ip-rimlight)" />
                  <circle cx="93" cy="93" r="91.6" fill="url(#ip-wheel)" />
                  <path
                    id="trail"
                    fill="none"
                    stroke="#ef6a1e"
                    stroke-opacity=".28"
                    stroke-width="11"
                    stroke-linecap="round"
                  />
                  <path
                    id="trailHi"
                    fill="none"
                    stroke="#fff"
                    stroke-opacity=".85"
                    stroke-width="2.2"
                    stroke-linecap="round"
                  />
                  <g id="touch" opacity="0">
                    <circle r="21" fill="url(#ip-touch)" />
                    <circle r="8.5" fill="none" stroke="#fff" stroke-width="1.4" />
                    <circle
                      r="8.5"
                      fill="none"
                      stroke="#ef6a1e"
                      stroke-opacity=".45"
                      stroke-width=".8"
                      transform="translate(0 .7)"
                    />
                  </g>
                  <g class="legend" data-zone="menu">
                    <text
                      x="93"
                      y="29"
                      text-anchor="middle"
                      font-weight="700"
                      font-size="11.5"
                      letter-spacing=".6"
                    >
                      MENU
                    </text>
                  </g>
                  <g class="legend" data-zone="prev">
                    <rect x="18" y="87.5" width="2.4" height="11" />
                    <path d="M28.5,87.5 v11 l-8,-5.5z M36.5,87.5 v11 l-8,-5.5z" />
                  </g>
                  <g class="legend" data-zone="next">
                    <path d="M149.5,87.5 v11 l8,-5.5z M157.5,87.5 v11 l8,-5.5z" />
                    <rect x="165.6" y="87.5" width="2.4" height="11" />
                  </g>
                  <g class="legend" data-zone="play">
                    <path d="M80,155 v10.5 l8,-5.25z" />
                    <rect x="92" y="155" width="3" height="10.5" />
                    <rect x="97.5" y="155" width="3" height="10.5" />
                  </g>
                  <circle cx="93" cy="93" r="40.5" fill="#000" opacity=".10" />
                  <circle cx="93" cy="93" r="39.5" fill="url(#ip-btnrim)" />
                  <circle id="centerFace" cx="93" cy="93" r="38.6" fill="url(#ip-btn)" />
                </svg>
                <div
                  class="ring"
                  id="ring"
                  role="slider"
                  tabindex="0"
                  aria-label="Click wheel: turn to scroll, or use the arrow keys"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                ></div>
                <button class="zone menu" data-zone="menu" aria-label="Menu"></button>
                <button class="zone next" data-zone="next" aria-label="Next"></button>
                <button class="zone play" data-zone="play" aria-label="Play or pause"></button>
                <button class="zone prev" data-zone="prev" aria-label="Previous"></button>
                <button class="center" id="center" aria-label="Select"></button>
              </div>
              <div class="eko-mark">EKO</div>
            </div>
            <div class="rim"></div>
            <div class="rim l"></div>
          </div>
        </div>
      </div>

      <section class="dock">
        <button class="sync" id="sync">Sync music</button>
        <p class="hint">
          or drop audio files anywhere. Turn the wheel to browse; press the centre to choose.
        </p>
      </section>
      <p class="sr-only" id="live" role="status" aria-live="polite"></p>
    </main>

    <nav class="pg-bar" aria-label="Playground">
      <a href="../">Back to the Playground</a>
      <span class="pg-hint"
        ><kbd>&uarr;</kbd><kbd>&darr;</kbd> wheel &nbsp; <kbd>Enter</kbd> select &nbsp;
        <kbd>Esc</kbd> menu &nbsp; <kbd>Space</kbd> play</span
      >
    </nav>

    <script type="module" src="./app.js"></script>
    <script>
      addEventListener("load", () => {
        setTimeout(() => {
          if (document.documentElement.dataset.ready) return;
          document.getElementById("live").classList.remove("sr-only");
          document.getElementById("live").textContent =
            location.protocol === "file:"
              ? "This page has to be served over http: run npm run harness from the repo root."
              : "Could not load the engine. Run npm run build first, then reload.";
        }, 1500);
      });
    </script>
  </body>
</html>
